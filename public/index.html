<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快問快答｜多人競賽</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:linear-gradient(135deg,#eaf0ff,#f7fbff);
  color:#202640;
}
.wrap{max-width:850px;width:93%;margin:auto;padding:25px 0 50px}
header{text-align:center;margin-bottom:20px}
h1{font-size:32px}
.card{
  background:white;
  padding:24px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 5px 25px #0000000d;
}
h2{margin-top:0}
input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:6px 0 12px;
  font-size:16px;
}
textarea{min-height:70px}
button{
  border:0;
  padding:12px 18px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:#4263eb;color:white}
.secondary{background:#edf0f8;color:#333}
.danger{background:#ffecec;color:#c00;padding:7px 12px}
.hidden{display:none!important}
label{font-weight:bold}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.center{text-align:center}
.muted{color:#777}
.code{
  font-size:48px;
  font-weight:bold;
  letter-spacing:8px;
  color:#4263eb;
  text-align:center;
  padding:15px;
  background:#f0f3ff;
  border-radius:12px;
}
.sharebox{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  margin:20px 0;
}
.qrbox{
  padding:10px;
  border:1px solid #ddd;
  border-radius:12px;
  min-width:170px;
  min-height:170px;
  display:grid;
  place-items:center;
}
.players{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px;
}
.player{
  padding:10px;
  background:#f3f5fa;
  border-radius:9px;
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.option-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.option-row input[type=radio]{width:auto}
.question{
  font-size:26px;
  line-height:1.5;
}
.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.answer{
  background:#f1f4ff;
  color:#222;
  border:2px solid #dce3ff;
  text-align:left;
  min-height:60px;
}
.answer:disabled{opacity:.8}
.answer.correct{background:#d9f8e9;border-color:#22a06b}
.progress{
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}
.bar{height:100%;background:#20a77b;width:100%}
.qrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid #eee;
  padding:12px 0;
}
.rank{font-size:22px;color:#4263eb;margin-right:10px}
.status{font-weight:bold;margin-top:15px;min-height:25px}
@media(max-width:600px){
  .answers{grid-template-columns:1fr}
  .code{font-size:38px}
}
</style>
</head>

<body>
<div class="wrap">

<header>
<h1>🏆 快問快答・多人競賽</h1>
<p class="muted">掃描 QR Code，加入即時問答遊戲！</p>
</header>

<!-- 主持人建立遊戲 -->
<section class="card hidden" id="hostSetup">

<h2>🎤 主持人專區</h2>

<label>主持人名稱</label>
<input id="hostName" value="主持人" maxlength="16">

<label>每題作答時間</label>
<select id="seconds">
<option value="10">10 秒</option>
<option value="15" selected>15 秒</option>
<option value="20">20 秒</option>
<option value="30">30 秒</option>
<option value="45">45 秒</option>
<option value="60">60 秒</option>
</select>

<hr>

<h2>📝 題庫編輯</h2>

<label>題目內容</label>
<textarea id="qInput" placeholder="請輸入題目"></textarea>

<div id="optionFields"></div>

<div class="buttons">
<button class="primary" id="addQuestionBtn">＋ 新增題目</button>
<button class="secondary" id="resetFormBtn">清空欄位</button>
</div>

<h3>目前題庫：<span id="qCount">0</span> 題</h3>
<div id="questionList"></div>

<hr>

<button class="primary" id="createBtn" style="width:100%">
建立遊戲房間
</button>

</section>

<!-- 玩家加入：QR Code 會直接進入這個畫面 -->
<section class="card hidden" id="playerJoin">

<h2 class="center">🙋 加入遊戲</h2>

<p class="center muted">請輸入你的玩家姓名</p>

<label>玩家姓名</label>
<input id="playerName" maxlength="16" placeholder="輸入姓名">

<button class="primary" id="joinBtn" style="width:100%">
加入遊戲
</button>

<p class="center muted" id="joinMessage"></p>

</section>

<!-- 主持人等待室 -->
<section class="card hidden" id="hostLobby">

<h2 class="center">🎉 房間建立成功！</h2>

<p class="center muted">請玩家掃描 QR Code 加入</p>

<div class="code" id="hostCode"></div>

<div class="sharebox">
<div class="qrbox" id="roomQr"></div>
</div>

<p class="center muted">目前玩家人數</p>
<h2 class="center" id="hostPlayerCount">0 人</h2>

<div class="players" id="hostPlayers"></div>

<div class="buttons">
<button class="primary" id="startBtn" style="width:100%">
開始遊戲
</button>
</div>

</section>

<!-- 玩家等待室 -->
<section class="card hidden" id="playerLobby">

<h2 class="center">✅ 加入成功！</h2>

<p class="center" id="joinedMessage"></p>

<p class="center muted">等待主持人開始遊戲……</p>

</section>

<!-- 遊戲畫面 -->
<section class="card hidden" id="game">

<div style="display:flex;justify-content:space-between">
<strong id="questionNo"></strong>
<strong id="timer">15 秒</strong>
</div>

<div class="progress">
<div class="bar" id="timeBar"></div>
</div>

<h2 class="question" id="questionText"></h2>

<div class="answers" id="answerList"></div>

<div class="status" id="gameStatus"></div>

<p class="muted" id="answerCount"></p>

<div class="buttons hidden" id="hostNextWrap">
<button class="primary" id="nextBtn" style="width:100%">
下一題
</button>
</div>

</section>

<!-- 最終排行榜 -->
<section class="card hidden" id="finished">

<h1 class="center">🏆 遊戲結束！</h1>

<h2 class="center">最終排行榜</h2>

<div id="finalRanking"></div>

<button class="secondary" onclick="location.href=location.pathname">
返回首頁
</button>

</section>

</div>

<script>
const socket=io();

let role=null;
let questions=[
{q:"台灣最高的山是哪一座？",options:["玉山","雪山","阿里山","合歡山"],answer:0},
{q:"一年有幾個月？",options:["10 個月","11 個月","12 個月","13 個月"],answer:2},
{q:"下列哪一個是哺乳類動物？",options:["企鵝","海豚","鱷魚","青蛙"],answer:1}
];

let timerInterval=null;
let currentRoomCode=null;

const $=id=>document.getElementById(id);

function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

// 初始化題目選項
function buildOptionFields(){
$("optionFields").innerHTML="";

for(let i=0;i<4;i++){
const row=document.createElement("div");
row.className="option-row";

row.innerHTML=`
<input id="opt${i}" placeholder="選項 ${"ABCD"[i]}">
<label>
<input type="radio" name="correct" value="${i}" ${i===0?"checked":""}>
 正確答案
</label>`;

$("optionFields").appendChild(row);
}
}

// 題庫列表
function renderQuestions(){
$("qCount").textContent=questions.length;
$("questionList").innerHTML="";

questions.forEach((q,i)=>{
const row=document.createElement("div");
row.className="qrow";

const title=document.createElement("span");
title.textContent=`${i+1}. ${q.q}`;

const del=document.createElement("button");
del.className="danger";
del.textContent="刪除";

del.onclick=()=>{
questions.splice(i,1);
renderQuestions();
};

row.append(title,del);
$("questionList").append(row);
});
}

// 清空題目表單
function resetForm(){
$("qInput").value="";
for(let i=0;i<4;i++)$("opt"+i).value="";
document.querySelector('input[name="correct"][value="0"]').checked=true;
}

// 新增題目
$("addQuestionBtn").onclick=()=>{
const q=$("qInput").value.trim();

const raw=[0,1,2,3].map(i=>$("opt"+i).value.trim());

const selected=Number(
document.querySelector('input[name="correct"]:checked').value
);

const options=raw.filter(Boolean);
const answer=raw.slice(0,selected).filter(Boolean).length;

if(!q)return alert("請輸入題目！");
if(options.length<2)return alert("至少需要兩個選項！");
if(!raw[selected])return alert("正確答案必須填寫！");
if(questions.length>=50)return alert("最多 50 題！");

questions.push({q,options,answer});

resetForm();
renderQuestions();
};

$("resetFormBtn").onclick=resetForm;

// 建立房間
$("createBtn").onclick=()=>{
if(!questions.length)return alert("請至少保留一題！");

socket.emit("createRoom",{
hostName:$("hostName").value,
questions,
seconds:Number($("seconds").value)
},res=>{

if(res.error)return alert(res.error);

role="host";
currentRoomCode=res.roomCode;

hide("hostSetup");
show("hostLobby");

$("hostCode").textContent=res.roomCode;

// QR Code 自動帶入房間代碼
const joinUrl=new URL(location.href);
joinUrl.search="";
joinUrl.searchParams.set("room",res.roomCode);

$("roomQr").innerHTML="";

new QRCode($("roomQr"),{
text:joinUrl.toString(),
width:160,
height:160
});

});
};

// 玩家加入
$("joinBtn").onclick=()=>{
const name=$("playerName").value.trim();

if(!name)return alert("請輸入玩家姓名！");

$("joinBtn").disabled=true;
$("joinMessage").textContent="正在加入房間……";

socket.emit("joinRoom",{
roomCode:currentRoomCode,
name
},res=>{

$("joinBtn").disabled=false;

if(res.error){
$("joinMessage").textContent=res.error;
return;
}

role="player";

hide("playerJoin");
show("playerLobby");

$("joinedMessage").textContent=`歡迎 ${res.name}！`;
});
};

// 開始遊戲
$("startBtn").onclick=()=>{
socket.emit("startGame",res=>{
if(res?.error)alert(res.error);
});
};

// 更新玩家列表
socket.on("players",players=>{

$("hostPlayerCount").textContent=`${players.length} 人`;

$("hostPlayers").innerHTML="";

players.forEach((p,i)=>{
const div=document.createElement("div");
div.className="player";
div.innerHTML=`<span>${i+1}. ${esc(p.name)}</span><strong>${p.score} 分</strong>`;
$("hostPlayers").append(div);
});

});

// 開始新題目
socket.on("question",data=>{

hide("hostLobby");
hide("playerLobby");
hide("finished");
show("game");

$("questionNo").textContent=`第 ${data.number} / ${data.total} 題`;
$("questionText").textContent=data.q;

$("gameStatus").textContent="";
$("answerCount").textContent="等待玩家作答……";
$("hostNextWrap").classList.add("hidden");

$("answerList").innerHTML="";

data.options.forEach((opt,i)=>{

const btn=document.createElement("button");
btn.className="answer";
btn.textContent=`${"ABCD"[i]}. ${opt}`;

btn.onclick=()=>{
if(role!=="player")return;

[...$("answerList").children].forEach(b=>b.disabled=true);

socket.emit("submitAnswer",{choice:i},res=>{
if(res?.error){
$("gameStatus").textContent=res.error;
}else{
$("gameStatus").textContent=res.correct?"✅ 回答正確！":"已送出答案，等待公布結果。";
}
});

};

$("answerList").append(btn);

});

startTimer(data.endsAt,data.seconds);

});

// 倒數計時
function startTimer(endsAt,total){

clearInterval(timerInterval);

function tick(){

const left=Math.max(0,endsAt-Date.now());
const secs=Math.ceil(left/1000);

$("timer").textContent=`⏱ ${secs} 秒`;

$("timeBar").style.width=`${left/(total*1000)*100}%`;

if(left<=0){
clearInterval(timerInterval);
}
}

tick();
timerInterval=setInterval(tick,150);
}

// 更新答題人數
socket.on("answerCount",data=>{
$("answerCount").textContent=
`已作答：${data.answered} / ${data.total} 人`;
});

// 公布答案
socket.on("reveal",data=>{

clearInterval(timerInterval);

$("gameStatus").textContent=
`正確答案：${"ABCD"[data.correct]}. ${data.correctText}`;

[...$("answerList").children].forEach((btn,i)=>{
btn.disabled=true;
if(i===data.correct)btn.classList.add("correct");
});

if(role==="host"){
show("hostNextWrap");
}

});

// 下一題
$("nextBtn").onclick=()=>{
socket.emit("nextQuestion",res=>{
if(res?.error)alert(res.error);
});
};

// 遊戲結束
socket.on("gameOver",data=>{

clearInterval(timerInterval);

hide("game");
show("finished");

$("finalRanking").innerHTML="";

data.players.forEach((p,i)=>{

const row=document.createElement("div");
row.className="qrow";

row.innerHTML=`
<span><b class="rank">${i+1}.</b>${esc(p.name)}</span>
<strong>${p.score} 分</strong>`;

$("finalRanking").append(row);

});

});

// 房間關閉
socket.on("roomClosed",()=>{
alert("主持人已離開，遊戲房間已關閉。");
location.href=location.pathname;
});

// 連線錯誤
socket.on("connect_error",()=>{
alert("連線失敗，請重新整理頁面。");
});

// 網址判斷：有 room 參數就是玩家模式
function init(){

const params=new URLSearchParams(location.search);
const room=params.get("room");

if(room){

currentRoomCode=room.toUpperCase();

hide("hostSetup");
show("playerJoin");

}else{

hide("playerJoin");
show("hostSetup");

}

}

buildOptionFields();
renderQuestions();
init();

</script>
</body>
</html>
